[project]
name = "asofar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VanessaKingsleyHerts", email = "vk23abn@herts.ac.uk" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
asofar = "asofar:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
